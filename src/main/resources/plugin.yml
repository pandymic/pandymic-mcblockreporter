name: McBlockReporter
version: 1.0
main: com.pandymic.dev.mcblockreporter.McBlockReporterPlugin
api-version: 1.19
commands:
  httpblockinfo:
    description: Retrieves and sends block information to a REST API with optional extra data or target selector.
    usage: /httpblockinfo <x> <y> <z> [extraData|@selector]
  localblockinfo:
    description: Displays block information locally as JSON.
    usage: /localblockinfo <x> <y> <z> [extraData|@selector]
  registerblockmonitor:
    description: Registers a block with the web service's monitored-block registry, so its state is tracked and reported going forward.
    usage: /registerblockmonitor [x y z] [label]
  scanrailnetwork:
    description: Traces the connected rail network from the nearest rail to a coordinate and reports it to the web service.
    usage: /scanrailnetwork <world> <x> <y|~> <z> [label]